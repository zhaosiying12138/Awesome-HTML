<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awesome HTML</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent2: #f78166;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #59636e;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px;
  }
  header { text-align: center; margin-bottom: 48px; }
  h1 { font-size: 2.2rem; letter-spacing: 0.5px; }
  h1 .hot { color: var(--accent2); }
  header p { color: var(--muted); margin-top: 10px; font-size: 1rem; }
  main { width: 100%; max-width: 760px; display: grid; gap: 20px; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    text-decoration: none;
    color: var(--text);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(88, 166, 255, .15);
  }
  .card .tag {
    display: inline-block;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--accent);
    border: 1px solid currentColor;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .card h2 { font-size: 1.25rem; line-height: 1.45; }
  .card p { color: var(--muted); margin-top: 8px; font-size: .92rem; line-height: 1.6; }
  footer { margin-top: 56px; color: var(--muted); font-size: .82rem; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Awesome <span class="hot">HTML</span></h1>
  <p>单文件技术长文合集 · 托管于 GitHub Pages</p>
</header>
<main>
  <a class="card" href="./ascend950_tilelang_cookbook.html">
    <span class="tag">Ascend 950 · TileLang</span>
    <h2>Ascend 950 · TileLang DSL Cookbook</h2>
    <p>面向昇腾 950 的 TileLang DSL 实战手册：从算子模板到调试技巧的系统整理。</p>
  </a>
  <a class="card" href="./cdna5_vs_cdna4.html">
    <span class="tag">CDNA5 vs CDNA4 · ISA</span>
    <h2>CDNA5 相比 CDNA4 改了哪些 ISA</h2>
    <p>逐项梳理 CDNA5 相对 CDNA4 的指令集架构变更：新增、废弃与语义调整全景对照。</p>
  </a>
</main>
<footer>
  Source on <a href="https://github.com/zhaosiying12138/Awesome-HTML" target="_blank" rel="noopener">GitHub</a>
</footer>
</body>
</html>
